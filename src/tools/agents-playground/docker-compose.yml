version: '3.8'

services:
  engine:
    build:
      context: .
      dockerfile: Dockerfile
    image: neural-agent-engine:latest
    container_name: neural-agent-engine
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./src:/app/src
