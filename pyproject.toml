[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentos-core"
version = "1.0.0"
description = "AgentOS High-Performance Swarm Ecosystem"
readme = "README.md"
authors = [{ name = "Polymath Void", email = "shuvops@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "aiortc>=1.6.0",
    "wasmtime>=16.0.0",
    "websockets",
    "pyzmq",
    "textual",
    "rich"
]

[project.scripts]
agentos = "agentos.orchestration.kernel:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentos*"]
